<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000"><title>Una cosita para ti ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#faedef;color:#653c45;font-family:'DM Sans',sans-serif;display:grid;place-items:center;overflow:hidden;background-image:radial-gradient(#dcaeb740 .8px,transparent .8px);background-size:22px 22px}.note{position:absolute;top:34px;letter-spacing:3px;text-transform:uppercase;font-size:10px;font-weight:700;color:#a77c85}.card{position:relative;text-align:center;width:min(90vw,530px);padding:38px 26px 34px;border:1px solid #fff;background:#fffaf7;box-shadow:0 25px 80px #9d5e6d12;border-radius:180px 180px 24px 24px}.tag{font-size:10px;text-transform:uppercase;letter-spacing:2.8px;color:#b18a91;margin:8px 0 20px}.drawing{width:150px;height:150px;margin:auto;display:block}.heart{fill:#d66c87}.potato{fill:#eac591;stroke:#9e704d;stroke-width:2.5}.face{fill:none;stroke:#754f3d;stroke-width:3;stroke-linecap:round}h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(40px,8vw,58px);font-weight:600;letter-spacing:-2px;line-height:1.12;margin:18px 0}p{font-size:14px;line-height:1.8;color:#a08388;margin:0 auto;max-width:300px}.actions{display:flex;justify-content:center;gap:16px;margin:29px 0 20px;min-height:51px}button{font:600 14px 'DM Sans',sans-serif;border-radius:50px;height:50px;min-width:112px;padding:0 30px;cursor:pointer;touch-action:manipulation}#yes{background:#b95e76;border:1px solid #b95e76;color:white;box-shadow:0 7px 16px #b95e7625;transition:transform .2s}#yes:hover{transform:translateY(-3px);background:#a84c64}#no{color:#a07d86;background:#fffaf7;border:1px solid #e8d4d9;z-index:10}button:focus-visible{outline:3px solid #78535e;outline-offset:5px}.hint{font-size:10px;color:#bea2a9;letter-spacing:.4px}.bottom{position:absolute;bottom:25px;font-family:Georgia,serif;font-style:italic;color:#b18a91;font-size:13px}.deco{position:absolute;color:#ddb1be;font-family:Georgia,serif;font-size:50px;transform:rotate(-15deg);left:12%;top:22%}.deco.second{left:auto;right:12%;top:auto;bottom:21%;font-size:35px;transform:rotate(15deg)}.progress{display:flex;gap:7px;justify-content:center;margin-top:24px}.dot{width:5px;height:5px;border-radius:50%;background:#ead6da}.dot.active{width:20px;border-radius:5px;background:#ba778a}.confetti{position:fixed;top:-30px;pointer-events:none;animation:fall 3s ease-in forwards;z-index:30}@keyframes fall{to{transform:translateY(110vh) rotate(300deg);opacity:0}}@media(max-height:650px){.note{top:12px}.bottom{bottom:10px}.card{padding:20px}.drawing{height:110px}.tag{margin:0 0 8px}h1{margin:10px 0}.actions{margin:18px 0 12px}.progress{margin-top:14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{overflow:auto;padding:65px 0 55px}.card{border-radius:28px;padding:24px}.photo{display:block;width:auto;max-width:100%;height:260px;object-fit:contain;border-radius:12px;margin:0 auto}.note{position:fixed;top:20px}.bottom{position:static;margin-top:22px;grid-column:1}.card h1{font-size:clamp(34px,7vw,48px)}.deco{pointer-events:none}.tag{margin:0 0 16px}@media(max-height:750px){body{padding:45px 0 20px}.photo{height:220px}.card{padding:20px}.card h1{font-size:34px;margin:12px 0}.actions{margin:18px 0 12px}.progress{margin-top:14px}.bottom{margin-top:14px}}
body{background:#000;background-image:none}
#final-link{display:inline-block;background:#b95e76;color:#fff;text-decoration:none;padding:15px 32px;border-radius:50px;margin:24px 0 12px;font-weight:600}#final-link:hover{background:#a84c64}#final-link:focus-visible{outline:3px solid #78535e;outline-offset:5px}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="note">Tengo algo que decirte</div><span class="deco" aria-hidden="true">♡</span><span class="deco second" aria-hidden="true">♡</span>
<main class="card">
<div class="tag">Para ti, con cariñito</div>
<img id="photo" class="photo" src="perdon.png" alt="Perrito blanco que extraña a su papita">
<section aria-live="polite"><h1 id="title">Perdón…</h1><p id="subtitle">¿Me regalas otra sonrisita?</p></section>
<div class="actions"><button id="yes">Sí ♡</button><button id="no">No</button></div>
<a id="final-link" hidden href="https://docs.google.com/forms/d/e/1FAIpQLSdJ34V3Vkty0gNlFYsSTQhmLvpcO3gHNNUseQB14blFfZIkPg/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer">Entra aquí</a>
<div id="hint" class="hint">Creo que el “No” es un poquito tímido...</div>
<div class="progress" aria-hidden="true"><span class="dot active"></span><span class="dot"></span></div>
</main>
<script>
const no=document.querySelector('#no'),yes=document.querySelector('#yes'),title=document.querySelector('#title'),subtitle=document.querySelector('#subtitle');let step=0,lastMove=0;
function escapeNo(){const now=performance.now();if(now-lastMove<90)return;lastMove=now;const w=no.offsetWidth,h=no.offsetHeight,pad=16;const maxX=Math.max(pad,innerWidth-w-pad),maxY=Math.max(pad,innerHeight-h-pad);const old=no.getBoundingClientRect(),accept=yes.getBoundingClientRect();let x,y;for(let i=0;i<30;i++){x=pad+Math.random()*(maxX-pad);y=pad+Math.random()*(maxY-pad);if(Math.hypot(x-old.x,y-old.y)>130&&!(x<accept.right+25&&x+w>accept.left-25&&y<accept.bottom+25&&y+h>accept.top-25))break;}Object.assign(no.style,{position:'fixed',left:x+'px',top:y+'px',margin:'0'});}
document.addEventListener('pointermove',e=>{if(step>1||e.pointerType==='touch')return;const r=no.getBoundingClientRect();if(e.clientX>r.left-45&&e.clientX<r.right+45&&e.clientY>r.top-45&&e.clientY<r.bottom+45)escapeNo();});
no.addEventListener('pointerdown',e=>{e.preventDefault();escapeNo();});no.addEventListener('click',e=>{e.preventDefault();escapeNo();});
function resetNo(){no.removeAttribute('style');lastMove=0;}window.addEventListener('resize',resetNo);
yes.addEventListener('click',()=>{if(step===1){step=2;document.querySelector('.actions').hidden=true;document.querySelector('#hint').hidden=true;document.querySelector('#final-link').hidden=false;return;}if(step===2)return;step=1;resetNo();title.textContent='¿Puedo volver a ser tu papita?';subtitle.textContent='Tu papita te extraña un poquito… bueno, mucho.';const photo=document.querySelector('#photo');photo.src='papita.png';photo.alt='Perrito negro con un mensaje de perdón para su papita';document.querySelectorAll('.dot').forEach((dot,i)=>dot.classList.toggle('active',i===step));});
</script>
</body></html>
